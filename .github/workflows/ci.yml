name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: init + validate each root and module (passes with zero dirs)
        run: |
          set -euo pipefail
          n=0
          for d in environments/* modules/*; do
            [ -d "$d" ] || continue
            ls "$d"/*.tf >/dev/null 2>&1 || continue
            n=$((n + 1))
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
          echo "validated $n dir(s)"

  tflint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
      - run: tflint --recursive

  region-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/tests/test_check_region_pin.sh
      - run: bash scripts/check-region-pin.sh

  workflow-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/tests/test_check_workflows.sh
      - run: bash scripts/check-workflows.sh

  # ecofolk-infra#7: cost and safety guards as conftest policy over the HCL (no credentials, no plan).
  # conftest comes from `go install` at a fixed version: the Go checksum database (sum.golang.org)
  # verifies the module, and no third-party action is needed.
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: install conftest v0.70.1
        run: |
          go install github.com/open-policy-agent/conftest@v0.70.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: bash scripts/tests/test_policy_files.sh
      - run: conftest verify --policy policy --data policy/data.json
      - name: conftest test (every tracked *.tf; fails on any tracked *.tf.json)
        run: |
          set -euo pipefail
          files_out=$(bash scripts/policy-files.sh)
          mapfile -t files <<< "$files_out"
          conftest test --parser hcl2 --combine --policy policy --data policy/data.json "${files[@]}"
