# ecofolk-infra#10: keep the Terraform provider pins and the SHA-pinned GitHub Actions from going stale.
# Dependabot only opens PRs; they run the same PR CI as any other change, and nothing here merges them.
# Actions stay pinned to a full 40-hex SHA (scripts/check-workflows.sh); Dependabot bumps the SHA and
# its trailing `# vX.Y.Z` comment together.
#
# One terraform directory per root and module. A new module or environment must be added here.
version: 2
updates:
  - package-ecosystem: terraform
    directories:
      - /environments/dev
      - /environments/prod
      - /modules/artifact_registry
      - /modules/auth
      - /modules/billing_killswitch
      - /modules/cloudrun_api
      - /modules/cloudsql
      - /modules/media_bucket
      - /modules/monitoring
      - /modules/network
      - /modules/project
      - /modules/secrets
      - /modules/sql_off_hours
      - /modules/web_hosting
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns: ['*']
    # ecofolk-infra#70 (Architect, 2026-10-16, closing PR #68): a provider MAJOR never arrives as an
    # auto-PR. PR CI (validate, mock-provider `terraform test`) cannot see how a new major plans against
    # live state; the first real plan would be the main apply, which applies to dev. Minor and patch keep
    # flowing. scripts/check-dependabot-majors.sh holds this in CI.
    # Majors are taken by hand, ONE major per PR (google / google-beta 5 -> 6 -> 7 -> 8, per the
    # provider upgrade guides), each behind a plan-only proof: TF_APPLY_ENABLED off before the merge,
    # review the plan for no unexpected destroy/replace, then re-enable and apply. Architect-reviewed;
    # Deployer runs the gate. 5.x stays pinned at `~> 5.0` meanwhile.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci(deps)'
    open-pull-requests-limit: 5
