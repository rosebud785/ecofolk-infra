name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: init + validate each root and module (passes with zero dirs)
        run: |
          set -euo pipefail
          n=0
          for d in environments/* modules/*; do
            [ -d "$d" ] || continue
            ls "$d"/*.tf >/dev/null 2>&1 || continue
            n=$((n + 1))
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
          echo "validated $n dir(s)"

  # ecofolk-infra#8: `terraform test` per module, against `mock_provider "google"` only (no credentials,
  # no GCP). A module without a tests/*.tftest.hcl fails the job: every module PR adds its own tests.
  # ecofolk-infra#107: the same for each environments/* ROOT that has tests/*.tftest.hcl (dev's scheduler-window
  # test, #99). A root without tests is skipped, but at least one root must have them, so a moved or renamed
  # test can't silently drop out of CI.
  tf-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: init + test each module and environment root
        run: |
          set -euo pipefail
          n=0
          fail=0
          for d in modules/*; do
            [ -d "$d" ] || continue
            ls "$d"/*.tf >/dev/null 2>&1 || continue
            if ! ls "$d"/tests/*.tftest.hcl >/dev/null 2>&1; then
              echo "::error::$d has no tests/*.tftest.hcl (every module ships its own terraform test, #8)"
              fail=1
              continue
            fi
            n=$((n + 1))
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" test -no-color || fail=1
            echo "::endgroup::"
          done
          echo "tested $n module(s)"
          e=0
          for d in environments/*; do
            [ -d "$d" ] || continue
            ls "$d"/tests/*.tftest.hcl >/dev/null 2>&1 || continue
            e=$((e + 1))
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" test -no-color || fail=1
            echo "::endgroup::"
          done
          echo "tested $e environment root(s)"
          if [ "$e" -eq 0 ]; then
            echo "::error::no environments/*/tests/*.tftest.hcl found (#107)"
            fail=1
          fi
          exit $fail

  # ecofolk-infra#6: jq parses every checked-in dashboard JSON (modules/*/dashboards/*.json). Zero files
  # fails the job, so a moved dashboard can't silently skip the check. The metric-type allowlist is
  # asserted by modules/monitoring/tests/dashboard.tftest.hcl (tf-test). jq ships on ubuntu-latest.
  dashboard-json:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: jq-validate each dashboard JSON
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'modules/*/dashboards/*.json')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no modules/*/dashboards/*.json found (#6)"
            exit 1
          fi
          fail=0
          for f in "${files[@]}"; do
            if jq empty "$f"; then echo "ok: $f"; else echo "::error file=$f::not valid JSON"; fail=1; fi
          done
          exit $fail

  tflint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: tflint --recursive

  region-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/tests/test_check_region_pin.sh
      - run: bash scripts/check-region-pin.sh

  # ecofolk-infra#3: restore-from-export.sh against a stubbed gcloud only (no credentials, no GCP).
  restore-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/tests/test_restore_from_export.sh

  workflow-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/tests/test_check_workflows.sh
      - run: bash scripts/check-workflows.sh
      # ecofolk-infra#70: provider majors are ignored in dependabot.yml (taken by hand, one per PR).
      - run: bash scripts/tests/test_check_dependabot_majors.sh
      - run: bash scripts/check-dependabot-majors.sh

  # #33: content secret scan over HEAD's full history. On pull_request HEAD is the merge commit, so that
  # is all of main plus every PR commit (catches a secret added in one PR commit and removed in a later
  # one). --log-opts=HEAD, not the default `git log --all`: fetch-depth: 0 fetches every branch, and
  # other PRs' branches must not fail this one. The gitleaks binary, not gitleaks/gitleaks-action: the
  # action wants GITHUB_TOKEN, and this job holds no token and no secrets. The tarball is checked against a sha256 copied from that
  # release's checksums file, hardcoded here, never fetched at run time. --redact keeps a hit out of
  # the public log. Allowlist only via .gitleaksignore (CODEOWNERS surface).
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, sha256-verified)
        run: |
          set -euo pipefail
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tgz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bash scripts/tests/test_secret_scan.sh
      - run: gitleaks git --log-opts="HEAD" --config .gitleaks.toml --redact --exit-code 1 .

  # ecofolk-infra#7: cost and safety guards as conftest policy over the HCL (no credentials, no plan).
  # conftest is the pinned v0.70.1 Linux x86_64 release tarball, checked against a sha256 copied from
  # that release's checksums.txt and hardcoded here (never fetched at run time), before it is extracted
  # into $RUNNER_TEMP/bin. A mismatch fails the install step. No Go toolchain, no third-party action.
  # #49: the former `go install` hit Go module proxy / sum.golang.org stream errors and gave false reds.
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONFTEST_VERSION: 0.70.1
      CONFTEST_SHA256: 613d124b8f6c1f3cee890491f7ab19114cca5a2102ca47cb2e6c35b4c23f9c8a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install conftest (pinned, sha256-verified)
        run: |
          set -euo pipefail
          tgz="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tgz" \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/$tgz"
          echo "${CONFTEST_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP/bin" conftest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bash scripts/tests/test_policy_files.sh
      - run: conftest verify --policy policy --data policy/data.json
      - name: conftest test (every tracked *.tf; fails on any tracked *.tf.json)
        run: |
          set -euo pipefail
          files_out=$(bash scripts/policy-files.sh)
          mapfile -t files <<< "$files_out"
          conftest test --parser hcl2 --combine --policy policy --data policy/data.json "${files[@]}"

  # ecofolk-infra#9: trivy misconfiguration scan of the Terraform only (--misconfig-scanners terraform);
  # HIGH and CRITICAL fail the job. trivy is the pinned v0.75.0 Linux-64bit release tarball, checked against
  # a sha256 copied from that release's checksums.txt and hardcoded here (never fetched at run time). The
  # checks bundle is pinned by digest too, so a new upstream check can't turn an unrelated PR red; bumping
  # it is a deliberate PR that re-baselines .trivyignore. Suppressions only via .trivyignore, each with a
  # one-line reason and an issue ref (scripts/check-trivyignore.sh). Table output to the log; no SARIF
  # upload, because security-events: write would break the read-only PR rule in scripts/check-workflows.sh.
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
      TRIVY_CHECKS_BUNDLE: mirror.gcr.io/aquasec/trivy-checks@sha256:b591e9190cff4aa4e385b1a25bccfd9ecf178d3c77fd194e1410b7ce7e1df058
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install trivy (pinned, sha256-verified)
        run: |
          set -euo pipefail
          tgz="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$tgz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bash scripts/tests/test_check_trivyignore.sh
      - run: bash scripts/check-trivyignore.sh
      - name: trivy config (HIGH/CRITICAL fail)
        run: |
          trivy config --checks-bundle-repository "$TRIVY_CHECKS_BUNDLE" --misconfig-scanners terraform \
            --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore .
